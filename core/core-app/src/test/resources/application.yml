spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:billingtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: true
  sql:
    init:
      mode: never

meilisearch:
  url: http://localhost:7700
  api-key: test-key
