spring:
  datasource:
    url: jdbc:postgresql://${DATABASE_POSTGRESQL_HOST:localhost}:${DATABASE_POSTGRESQL_PORT:5555}/${DATABASE_NAMES_CORE_BACKEND:projekan}?sslmode=${DATABASE_POSTGRESQL_SSLMODE:disable}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      schema-locations: classpath:ddl/postgres/schema-extra.sql
