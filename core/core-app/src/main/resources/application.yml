spring:
  application:
    name: core-backend
  profiles:
    active: ${database.provider:postgres}, ${seed.active:none}
    # active: postgres, dev-seed
    default: ${database.provider:postgres}, dev-formal
  config:
    import:
      - optional:file:./config/public-config.yml
      - optional:file:./config/private-config.yml
      - optional:file:../config/public-config.yml
      - optional:file:../config/private-config.yml
      - optional:file:../../config/public-config.yml
      - optional:file:../../config/private-config.yml
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  address: ${services.core.host:localhost}
  port: ${services.core.port:8081}

imagekit.url-endpoint: ${external.image_service.imagekit.url-endpoint:""}
imagekit.public-key: ${external.image_service.imagekit.public-key:""}
imagekit.private-key: ${external.image_service.imagekit.private-key:""}
