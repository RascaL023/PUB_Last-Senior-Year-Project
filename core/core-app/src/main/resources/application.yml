spring:
  application:
    name: core-backend
  profiles:
    active: ${SPRING_PROFILES}
    default: postgres, dev-seed
  config:
    import:
      # ── Environment config (selected by APP_ENV) ──
      # Native: APP_ENV=native → loads native.env
      # Docker: APP_ENV=docker → loads docker.env
      - optional:file:./config/${APP_ENV:native}.env[.properties]
      - optional:file:../config/${APP_ENV:native}.env[.properties]
      - optional:file:../../config/${APP_ENV:native}.env[.properties]
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: ${JPA_OSIV:false}
    show-sql: ${JPA_SHOW_SQL:true}
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  address: ${SERVICES_CORE_HOST:localhost}
  port: ${SERVICES_CORE_PORT:8081}

app:
  name: ${APP_NAME:hysteria-cafe}
  dev-base-url: ${APP_DEV_BASE_URL:https://dev.rascal.my.id}

id:
  rascal:
    filter:
      jwt-bypass-uris:
        - /api/v1/auths/refresh
        - /api/v1/payments/webhooks/xendit
        - /api/v1/images/webhooks/imagekit
        - /api/v1/auths/login
        - /api/v1/auths/refresh
        - /api/v1/auths/forgot-password
        - /api/v1/auths/reset-password
        - /api/v1/customers/register
        - /api/v1/menus
        - /api/v1/menus/top
        - /api/v1/menus/{id}
        - /api/v1/menus/categories
        - /api/v1/menus/categories/{id}
        - /api/v1/guest/dinings/{guestToken}
        - /api/v1/guest/dinings/{guestToken}/orders
        - /api/v1/guest/dinings/by-code/{guestCode}
        - /api/v1/guest/orders/{trackToken}
logging.level.id.rascal.filter: ${SECURITY_FILTER_LOG_LEVEL:WARN}

imagekit:
  base-url: ${IMAGEKIT_BASE_URL:""}
  url-endpoint: ${IMAGEKIT_URL_ENDPOINT:""}
  public-key: ${IMAGEKIT_PUBLIC_KEY:""}
  private-key: ${IMAGEKIT_PRIVATE_KEY:""}
  upload-folder: ${IMAGEKIT_UPLOAD_FOLDER:/menus}
  webhooks:
    endpoint: ${IMAGEKIT_WEBHOOKS_ENDPOINT:""}
    secret: ${IMAGEKIT_WEBHOOKS_SECRET:""}

xendit:
   base-url: ${XENDIT_BASE_URL:https://api.xendit.co}
   private-key: ${XENDIT_PRIVATE_KEY:""}
   public-key: ${XENDIT_PUBLIC_KEY:""}
   callback-token: ${XENDIT_CALLBACK_TOKEN:""}
   success-redirect-url: ${XENDIT_SUCCESS_REDIRECT_URL:}
   failure-redirect-url: ${XENDIT_FAILURE_REDIRECT_URL:}

meilisearch:
  url: ${MEILISEARCH_URL:http://localhost:7700}
  api-key: ${MEILISEARCH_API_KEY:}

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:noreply@rascal.my.id}
  base-url: ${RESEND_BASE_URL:https://api.resend.com}
  sender-name: ${RESEND_SENDER_NAME:}

notification:
  reset-token-expiry-minutes: ${NOTIFICATION_RESET_TOKEN_EXPIRY_MINUTES:60}
