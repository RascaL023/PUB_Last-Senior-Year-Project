services:

  kong:
    image: kong:3.6
    container_name: kong-gateway
    network_mode: host
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/usr/local/kong/declarative/kong.yml"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_LOG_LEVEL: debug
      KONG_PLUGINS: "bundled"
      KONG_LUA_PACKAGE_PATH: "/kong/plugins/?.lua;/kong/plugins/?/init.lua;;"
      KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE: "10m"
    volumes: 
      - ./api-gateway/kong/kong.yml:/usr/local/kong/declarative/kong.yml:ro
      - ./api-gateway/kong/plugins:/kong/plugins

