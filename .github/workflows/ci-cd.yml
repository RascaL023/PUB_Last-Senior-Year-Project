name: Backend CI/CD

on:
  push:
    branches:
      - main
      - dev
      - "feature/ci-cd"

  workflow_dispatch:

# ============================================================
# Global configuration
# ============================================================

env:
  JAVA_VERSION: "21"

  IMAGE_NAME: ghcr.io/rascal023/rascal-backend

  DEPLOY_HOST: 100.85.60.60
  DEPLOY_USER: rascal-server
  DEPLOY_DIR: ~/Projects/HysteriaCafeCD

concurrency:
  group: backend-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:

# ============================================================
# JOB 1 — CI
# ============================================================

  ci:
    name: CI — Build & Test

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    defaults:
      run:
        working-directory: core

    env:

      # --------------------------------------------------------
      # Dummy configuration required due to Spring context
      # --------------------------------------------------------

      RESEND_BASE_URL: https://api.resend.com
      RESEND_API_KEY: ci-dummy
      RESEND_FROM_EMAIL: ci@example.com
      RESEND_SENDER_NAME: CI

      IMAGEKIT_URL_ENDPOINT: https://ik.imagekit.io/ci
      IMAGEKIT_PUBLIC_KEY: ci-dummy
      IMAGEKIT_PRIVATE_KEY: ci-dummy

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Configure GitHub Packages credentials
        run: |
          mkdir -p ~/.m2

          cat > ~/.m2/settings.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Run tests
        run: ./mvnw -B test

      - name: Package
        run: ./mvnw -B -DskipTests package


  # ============================================================
  # JOB 2 — DOCKER
  # ============================================================

  docker:
    name: Docker — Build & Push

    needs: ci

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}

          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: core
          file: core/Dockerfile

          push: true

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          build-args: |
            GITHUB_USER=${{ github.actor }}
            GITHUB_TOKEN=${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # JOB 3 — CD
  # ============================================================

  deploy:
    name: CD — Deploy to Debian

    needs: docker

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

          tags: tag:ci

          ping: ${{ env.DEPLOY_HOST }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' \
            > ~/.ssh/github-cd

          chmod 600 ~/.ssh/github-cd

          ssh-keyscan -H "${{ env.DEPLOY_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh \
            -i ~/.ssh/github-cd \
            -o StrictHostKeyChecking=yes \
            "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" \
            'echo "SSH connection successful"'

      - name: Deploy to Debian
        run: |
          ssh \
            -i ~/.ssh/github-cd \
            -o StrictHostKeyChecking=yes \
            "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" \
            '
              set -e

              cd "$HOME/Projects/HysteriaCafeCD"

              echo "==> Pulling latest Docker image..."
              docker compose pull

              echo "==> Starting containers..."
              docker compose up -d

              echo "==> Deployment completed."

              echo "==> Container status:"
              docker compose ps
            '
