pid .assets/run/nginx.pid;
error_log .assets/run/logs/proxy-error.log;

events {}

http {
    include mime.types;
    default_type application/octet-stream;
    client_max_body_size 10m;
    limit_req_status 429;
    limit_req_zone ${DOLLAR}binary_remote_addr zone=api_per_ip:10m rate=10r/s;

    server {
        listen 9000;
        access_log .assets/run/logs/proxy-access.log;

        # Sumber tunggal origin FE untuk CORS (nilai di-render dari config/public-config.yml)
        set ${DOLLAR}cors_origin "${CORS_ORIGIN}";

        location /api/ {
            limit_req zone=api_per_ip burst=20 nodelay;

            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host ${DOLLAR}host;
            proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
            proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;

            # CORS support
            add_header 'Access-Control-Allow-Origin' ${DOLLAR}cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            if (${DOLLAR}request_method = 'OPTIONS') {
                return 204;
            }
        }

        location / {
            root ../frontend/build;
            index index.html;
            try_files ${DOLLAR}uri ${DOLLAR}uri.html ${DOLLAR}uri/ /index.html;
        }
    }
}
